<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        background: #000;
        color: #fff;
        font-family: -apple-system, sans-serif;
        overflow: hidden;
        cursor: none;
      }

      #canvas {
        width: 100%;
        height: 100%;
        position: relative;
        transition: opacity 0.4s ease;
      }

      .message-text {
        position: absolute;
        color: #fff;
        font-size: 16px;
        line-height: 1.4;
        max-width: 280px;
        word-wrap: break-word;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      .message-text.visible { opacity: 1; }

      /* ── PROMPT / INSTRUCTION OVERLAY ── */
      #prompt-display {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px;
        pointer-events: none;
        z-index: 8;
        opacity: 0;
        transition: opacity 1s ease;
      }
      #prompt-display.visible { opacity: 1; }

      #prompt-display-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #prompt-display-text {
        font-size: 36px;
        text-align: center;
        line-height: 1.4;
        color: #fff;
        max-width: 700px;
        word-break: break-word;
      }

      /* ── FLOATING EMOJI ── */
      .floating-emoji {
        position: fixed;
        font-size: 48px;
        bottom: -60px;
        pointer-events: none;
        z-index: 20;
        animation: floatUp 3s ease-out forwards;
      }

      @keyframes floatUp {
        0%   { transform: translateY(0) scale(1); opacity: 1; }
        70%  { opacity: 1; }
        100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="canvas"></div>

    <div id="prompt-display">
      <div id="prompt-display-inner">
        <div id="prompt-display-text"></div>
        <img id="prompt-qr" src="" alt="" style="display:none; width:160px; height:160px; margin-top:20px; border-radius:8px;">
      </div>
    </div>

    <script>
      const socket = io(window.location.origin, { query: { role: "display" } });
      const canvasEl = document.getElementById("canvas");
      let isEmojiMode = false;

      // Track placed boxes to avoid overlaps
      const placed = [];
      const PAD = 16;

      function placeMessage(text) {
        const el = document.createElement("div");
        el.className = "message-text";
        el.textContent = text;
        canvasEl.appendChild(el);

        // Measure after insert
        const W = canvasEl.offsetWidth;
        const H = canvasEl.offsetHeight;
        const elW = Math.min(280, W * 0.35);
        el.style.maxWidth = elW + "px";

        // Estimate height: ~1.4 line height * 16px * lines
        const charsPerLine = elW / 9;
        const lines = Math.ceil(text.length / charsPerLine);
        const elH = lines * 16 * 1.4 + 8;

        let x, y, tries = 0, overlap;
        do {
          x = PAD + Math.random() * (W - elW - PAD * 2);
          y = PAD + Math.random() * (H - elH - PAD * 2);
          overlap = placed.some(p =>
            x < p.x + p.w + PAD &&
            x + elW + PAD > p.x &&
            y < p.y + p.h + PAD &&
            y + elH + PAD > p.y
          );
          tries++;
        } while (overlap && tries < 80);

        placed.push({ x, y, w: elW, h: elH });
        el.style.left = x + "px";
        el.style.top = y + "px";

        requestAnimationFrame(() => el.classList.add("visible"));
      }

      // ── AUDIO ──
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const reverbLen = audioCtx.sampleRate * 1.8;
      const reverbBuf = audioCtx.createBuffer(2, reverbLen, audioCtx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = reverbBuf.getChannelData(ch);
        for (let i = 0; i < reverbLen; i++)
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / reverbLen, 2);
      }
      const reverb = audioCtx.createConvolver();
      reverb.buffer = reverbBuf;
      const reverbGain = audioCtx.createGain();
      reverbGain.gain.value = 0.4;
      reverb.connect(reverbGain);
      reverbGain.connect(audioCtx.destination);

      function setReverbAmount(val) {
        reverbGain.gain.setTargetAtTime(val, audioCtx.currentTime, 0.1);
      }

      function padVoice(freq, amp, attack, decay) {
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.value = freq + (Math.random() - 0.5) * 4;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(amp, t + attack);
        gain.gain.setValueAtTime(amp, t + attack + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + decay);
        const lpf = audioCtx.createBiquadFilter();
        lpf.type = "lowpass";
        lpf.frequency.value = freq * 2.5;
        lpf.Q.value = 0.5;
        osc.connect(gain);
        gain.connect(lpf);
        lpf.connect(audioCtx.destination);
        lpf.connect(reverb);
        osc.start(t);
        osc.stop(t + decay + 0.1);
      }

      function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
      const scale = [38,40,43,45, 50,52,55,57, 62,64,67,69, 74,76,79,81];
      function snapToScale(midi) {
        let closest = scale[0];
        for (const n of scale)
          if (Math.abs(n - midi) < Math.abs(closest - midi)) closest = n;
        return closest;
      }

      function playTextChime(textLen) {
        const len = Math.max(1, Math.min(textLen || 50, 300));
        const rawMidi = 66 - ((len - 1) / 299) * 28;
        const root = snapToScale(rawMidi);
        const chord = [
          snapToScale(root - 12), root,
          snapToScale(root + 3), snapToScale(root + 7),
          snapToScale(root + 12),
        ];
        chord.forEach((midi, i) => {
          setTimeout(() => padVoice(midiToFreq(midi), 0.045, 0.15, 7), i * 50);
        });
      }

      function playEmojiPop() {
        const t = audioCtx.currentTime;
        // Randomise each pop slightly
        const startFreq = 1400 + Math.random() * 1000;   // 1400–2400 Hz
        const endFreq   = 150  + Math.random() * 150;    // 150–300 Hz
        const sweepTime = 0.02 + Math.random() * 0.02;   // 0.02–0.04s
        const masterAmp = 0.22 + Math.random() * 0.12;   // 0.22–0.34
        const totalDur  = 0.09 + Math.random() * 0.06;   // 0.09–0.15s

        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(startFreq, t);
        osc.frequency.exponentialRampToValueAtTime(endFreq, t + sweepTime);
        osc.connect(oscGain);

        const bufSize = audioCtx.sampleRate * 0.02;
        const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const noiseData = noiseBuf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) noiseData[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuf;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.0001, t);
        noiseGain.gain.linearRampToValueAtTime(0.18, t + 0.001);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.016);
        noise.connect(noiseGain);

        const master = audioCtx.createGain();
        master.gain.setValueAtTime(0.0001, t);
        master.gain.linearRampToValueAtTime(masterAmp, t + 0.008);
        master.gain.exponentialRampToValueAtTime(0.0001, t + totalDur);
        oscGain.connect(master);
        noiseGain.connect(master);
        master.connect(audioCtx.destination);
        master.connect(reverb);
        osc.start(t); osc.stop(t + totalDur + 0.01);
        noise.start(t); noise.stop(t + 0.02);
      }

      // ── PROMPT / INSTRUCTION OVERLAY ──
      function showPromptDisplay(text) {
        const el = document.getElementById("prompt-display");
        const qr = document.getElementById("prompt-qr");
        document.getElementById("prompt-display-text").textContent = text;
        const isUrl = /^https?:\/\//i.test(text.trim());
        if (isUrl) {
          qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(text.trim())}&bgcolor=000000&color=ffffff`;
          qr.style.display = "block";
        } else {
          qr.style.display = "none";
        }
        canvasEl.style.opacity = "0.15";
        el.classList.add("visible");
      }

      function hidePromptDisplay() {
        document.getElementById("prompt-display").classList.remove("visible");
        canvasEl.style.opacity = "1";
      }

      // ── SOCKET EVENTS ──
      socket.on("state", ({ currentPrompt, responses }) => {
        responses.forEach(r => placeMessage(r.response));
        if (currentPrompt.active) {
          if (currentPrompt.type === "emoji") {
            isEmojiMode = true;
          } else if (responses.length === 0) {
            showPromptDisplay(currentPrompt.text);
          }
        }
      });

      socket.on("new_prompt", (prompt) => {
        if (prompt.type === "emoji") {
          isEmojiMode = true;
          hidePromptDisplay();
          canvasEl.style.opacity = "0";
          setReverbAmount(0.15);
        } else {
          isEmojiMode = false;
          showPromptDisplay(prompt.text);
        }
      });

      socket.on("new_response", (entry) => {
        if (isEmojiMode) return;
        hidePromptDisplay();
        playTextChime(entry.response.length);
        placeMessage(entry.response);
      });

      socket.on("emoji_reaction", (emoji) => {
        playEmojiPop();
        spawnFloatingEmoji(emoji);
      });

      socket.on("show_instruction", (text) => showPromptDisplay(text));
      socket.on("hide_instruction", () => hidePromptDisplay());

      socket.on("prompt_closed", () => {
        hidePromptDisplay();
        if (isEmojiMode) {
          canvasEl.style.opacity = "1";
          setReverbAmount(0.4);
        }
        isEmojiMode = false;
      });

      socket.on("responses_cleared", () => {
        canvasEl.innerHTML = "";
        placed.length = 0;
        hidePromptDisplay();
      });

      // ── FLOATING EMOJI ──
      function spawnFloatingEmoji(emoji) {
        const el = document.createElement("div");
        el.className = "floating-emoji";
        el.textContent = emoji;
        el.style.left = 10 + Math.random() * 80 + "vw";
        el.style.animationDuration = 2.5 + Math.random() * 1.5 + "s";
        document.body.appendChild(el);
        el.addEventListener("animationend", () => el.remove());
      }
    </script>
  </body>
</html>
