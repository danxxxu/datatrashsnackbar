<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display Chat</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, sans-serif;
    font-size: 15px;
    cursor: none;
  }

  #app {
    height: 100%;
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #messages::-webkit-scrollbar { display: none; }
  #messages { scrollbar-width: none; }

  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .bubble.prompt {
    background: #2a2a2a;
    color: #ccc;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border: 1px solid #3a3a3a;
  }

  .bubble.response {
    background: #007aff;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .bubble.system {
    align-self: center;
    color: #999;
    font-size: 13px;
    background: none;
    padding: 4px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="messages"></div>
</div>

<script>
  const socket = io(window.location.origin, { query: { role: 'display' } });
  const messages = document.getElementById('messages');

  // Unlock audio on first click, same pattern as audience.html
  let audioUnlocked = false;
  document.addEventListener('click', () => { audioUnlocked = true; }, { once: true });

  function playNotification() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(660, ctx.currentTime);
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.3);
  }

  function addBubble(text, type) {
    const div = document.createElement('div');
    div.className = 'bubble ' + type;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  socket.on('state', ({ currentPrompt, responses }) => {
    if (currentPrompt.active && currentPrompt.type !== 'emoji') {
      addBubble(currentPrompt.text, 'prompt');
    }
    responses.forEach(r => addBubble(r.response, 'response'));
  });

  socket.on('new_prompt', (prompt) => {
    if (prompt.type === 'emoji') {
      addBubble('React with emojis!', 'system');
    } else {
      addBubble(prompt.text, 'prompt');
    }
  });

  socket.on('new_response', (entry) => {
    playNotification();
    addBubble(entry.response, 'response');
  });

  socket.on('emoji_reaction', (emoji) => {
    playNotification();
    addBubble(emoji, 'response');
  });

  socket.on('prompt_closed', () => {
    addBubble('—', 'system');
  });

  socket.on('responses_cleared', () => {
    messages.innerHTML = '';
  });
</script>
</body>
</html>
